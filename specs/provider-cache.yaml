name: provider-cache
status: implemented
description: >
  When using --provider openrouter against an Anthropic-family model, Kodr
  enables Anthropic's prompt-caching by default, cutting prefill cost on every
  turn after the first. Opt out with --no-cache (or KODR_CACHE=0). LM Studio
  and Ollama are unaffected -- this is an OpenRouter-only, Anthropic-only
  transport detail.

approach: >
  Anthropic (and OpenRouter's pass-through of it) offers two ways to cache:
  explicit per-block cache_control markers placed inside specific message
  content, or "automatic caching" -- a single cache_control: { type:
  'ephemeral' } field at the root of the request body, alongside `messages`.
  With automatic caching the API itself walks backward from the last
  cacheable block and moves the breakpoint forward on every subsequent
  request, so the cached prefix grows with the conversation instead of being
  pinned to the system prompt. Kodr uses automatic caching: it needs no
  message mutation (src/provider-openrouter.mjs never touches
  params.messages, just extraBody), and it caches strictly more of the
  conversation each turn than a fixed system+first-user breakpoint would.
  See https://platform.claude.com/docs/en/build-with-claude/prompt-caching#automatic-caching
  and OpenRouter's prompt-caching docs, which confirm the same top-level field
  is honored for Anthropic-routed models.

inputs:
  cache:
    type: boolean
    required: false
    description: >
      --cache / --no-cache flag (or KODR_CACHE=1/0 env). Forces caching on or
      off regardless of model family. Absent (null), defaults to on when the
      resolved model id is Anthropic-family and off otherwise.
  model:
    type: string
    required: true
    description: >
      The resolved OpenRouter model id. Used only to detect Anthropic family
      (ids starting with "anthropic/", e.g. "anthropic/claude-opus-5",
      including the ":batch" suffix variant).

outputs:
  requestBody.cache_control:
    type: object
    description: >
      { type: 'ephemeral' } added at the root of the OpenRouter chat-completions
      request body (a sibling of `messages`, via extraBody) when caching is
      enabled. Omitted entirely when disabled.

constraints:
  - Root-level cache_control is a real, documented mechanism ("automatic
    caching"), not a misplaced attempt at per-message caching -- confirmed
    against both Anthropic's and OpenRouter's docs. src/model.mjs spreads
    extraBody onto the request body's root, which is exactly where this field
    belongs; provider-openrouter.mjs's extraBody.cache_control needs no
    further plumbing to work.
  - On by default only for Anthropic-family model ids (isAnthropicModelId:
    routed id starts with "anthropic/"). Sending cache_control to a
    non-Anthropic backend is meaningless, so it's gated on model family --
    the same default-on-for-Anthropic-only rationale as ZDR and
    data-collection-denial elsewhere in this file.
  - Precedence for openRouterCacheEnabled: an explicit --cache/--no-cache
    option, then KODR_CACHE (1/true or 0/false), then the Anthropic-family
    default. --cache forces it on even for a non-Anthropic model (an
    operator's explicit call); --no-cache forces it off even for an
    Anthropic model.
  - Scope: OpenRouter-only. src/provider.mjs threads `cache` only into
    createOpenRouterProvider; LM Studio and Ollama never see this option.
  - Kodr does not set a `ttl` on the cache_control object, so it uses
    Anthropic's automatic-caching default of a 5-minute TTL. A run whose
    turns are more than 5 minutes apart (a slow tool call, a long heal cycle)
    won't hit the cache on the following turn. A 1-hour TTL is available at
    2x the base input-token price but isn't exposed yet -- revisit if 5
    minutes proves too short in practice.

tests:
  unit:
    - isAnthropicModelId: true for "anthropic/*" ids (including a ":batch"
      suffix), false for other providers' ids, false for an empty/undefined id
    - openRouterCacheEnabled: defaults on for an anthropic/* model id, off for
      a non-anthropic model id, with no explicit flag or env set
    - openRouterCacheEnabled: explicit --cache (true) forces on regardless of
      model id
    - openRouterCacheEnabled: explicit --no-cache (false) forces off even for
      an anthropic/* model id
    - openRouterCacheEnabled: KODR_CACHE=1/true forces on and KODR_CACHE=0/false
      forces off when no explicit flag is passed
    - createOpenRouterProvider: extraBody carries cache_control: { type:
      'ephemeral' } at the root when caching is enabled
    - createOpenRouterProvider: extraBody has no cache_control key when
      caching is disabled or the model isn't Anthropic-family
    - cli: --cache / --no-cache parse into args.cache (true/false), default
      null so KODR_CACHE can still take effect
    - createProvider: threads options.cache through to
      createOpenRouterProvider; lmstudio/ollama factories ignore it
