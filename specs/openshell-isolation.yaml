name: openshell isolation wrapper
status: implemented
description: >
  A scripts/kodr-shell.sh wrapper that runs a local Kodr checkout inside an
  NVIDIA OpenShell sandbox. Kodr's run_command tool runs arbitrary /bin/sh -c
  commands with only cd targets jailed (see tool-run-command spec), and
  nothing at all constrains outbound network, so a bad model turn can read any
  path your user can read and POST it anywhere. The docker-isolation wrapper
  caps the filesystem half with a single writable mount and an iptables port
  allowlist. This wrapper is the tier above it, for the case that one does not
  cover: several unattended runs at once, or a real OPENROUTER_API_KEY in
  play. OpenShell's enforcement point is an HTTP proxy that matches rules
  against the *calling binary*, so node reaching the model endpoint and a
  model-issued curl reaching the same host and port are different decisions --
  an L4 port allowlist cannot tell them apart. Credentials live in an
  OpenShell provider record and are injected by the supervisor into approved
  requests only, so no key enters the sandbox. Like docker-isolation this is
  an external wrapper, not a Kodr feature: PROPOSAL.md dropped Docker and
  OpenShell sandboxing from the harness itself and that still holds --
  nothing under src/ learns it is sandboxed.

approach: >
  Two designs were available for reaching the model. OpenShell exposes
  https://inference.local inside every sandbox, which strips the caller's
  credential and injects the configured provider's -- tempting, because then
  no key is in the sandbox and no egress rule is needed. It is rejected here:
  inference.local pins one provider and one model per gateway, serves only
  the configured provider's supported path patterns, and proxies no model
  discovery. Kodr would lose `kodr models`, doctor's connection check,
  --model switching, and LM Studio's /api/v0/models extension that
  contextInfo and richModels read state, loaded_context_length and
  max_context_length from (see provider spec) -- a large amount of the
  provider surface traded away to avoid one allow rule. So: direct egress to
  the host model server, scoped to the node binary, with the key (when there
  is one) in a provider record. The wrapper also stays a shell script
  assembling `openshell` CLI calls rather than a src/ module, because every
  policy decision belongs to the supervisor; a Kodr module reasoning about
  its own confinement would be a second, weaker policy engine inside the
  thing being confined.

validation: >
  Validated end to end on 2026-11-07 against OpenShell CLI 0.0.56 / gateway
  0.0.57 on macOS with Docker Desktop, model qwen3.8-27b-mlx on host LM
  Studio. Observed: `kodr doctor` passing all four checks inside the sandbox;
  a real read/edit/run_command task fixing a broken add() with `verify pass`;
  node fetching the model endpoint returning 200 and six models while
  /usr/bin/curl against the identical URL returned
  `403 {"error":"policy_denied"}`; node and curl to https://example.com both
  denied; writes denied to /usr, /etc, /root, /var/tmp (mode 1777) and
  /home/sandbox (owned by the run-as user), the last two confirming Landlock
  rather than unix permissions; Seccomp 2 and NoNewPrivs 1 in
  /proc/self/status. The constraints below record what the CLI actually does,
  not what its newer published docs describe -- several flags differ.
  Re-validated the same day on CLI and gateway 0.1.7 after upgrading:
  the policy file below was accepted verbatim, node still fetched the
  model endpoint (200, six models) while /usr/bin/curl against the
  identical URL was still refused, and Landlock still denied /usr and
  /var/tmp while /tmp stayed writable. The per-binary guarantee therefore
  survives the 0.0 -> 0.1 jump; the mechanism behind it does not, see the
  egress constraint. The round trip and `kodr loop` were then validated on
  0.1.7 against a git fixture: a four-task checklist ran unattended to
  backlog-empty, every task marked `- [x] `, and the download returned a
  repo whose `git log` carried four `kodr: ` commits over the baseline with
  a clean `git status`, clean `git fsck` and a passing suite. Clean
  termination was observed on all three exits (backlog-empty, budget,
  parked). That run also surfaced BACKLOG #8, a host-side park-path bug
  unrelated to the sandbox.

inputs:
  args:
    type: array
    required: false
    description: >
      Everything after the wrapper's own --shell-* flags, forwarded verbatim
      to kodr (e.g. run "prompt" --model m). Empty args start Kodr's TUI.
  KODR_SHELL_SANDBOX:
    type: string
    required: false
    description: Sandbox name to create and exec into (default kodr-shell)
  KODR_SHELL_HOST:
    type: string
    required: false
    description: Host alias the sandbox uses to reach the LLM (default host.openshell.internal)
  KODR_SHELL_LMSTUDIO_PORT:
    type: string
    required: false
    description: Host LM Studio port for base-url injection and the allow rule (default 1234)
  KODR_SHELL_OLLAMA_PORT:
    type: string
    required: false
    description: Host Ollama port for base-url injection and the allow rule (default 11434)
  KODR_SHELL_NODE:
    type: string
    required: false
    description: >
      Absolute path of the node binary inside the sandbox, used as the
      --binary scope on the egress rule (default /usr/local/bin/node)
  KODR_SHELL_SANDBOX_ROOT:
    type: string
    required: false
    description: Writable root inside the sandbox for uploads and workspace (default /sandbox)
  KODR_SHELL_WORKSPACE:
    type: string
    required: false
    description: Host directory uploaded as the task workspace (default $PWD)
  KODR_SHELL_SRC:
    type: string
    required: false
    description: Host Kodr checkout to upload (default the wrapper's own repo root)
  KODR_SHELL_NETWORK:
    type: string
    required: false
    description: >
      locked (default) allows only the host LLM endpoint; open additionally
      allows the provider's public host (required for openrouter)
  KODR_SHELL_PROVIDER_RECORD:
    type: string
    required: false
    description: >
      Name of an existing `openshell provider` record to attach for
      credential injection; unset means no credentials reach the run
  KODR_SHELL_KEEP:
    type: string
    required: false
    description: >
      When 1, omit --no-keep so the sandbox outlives the run and edits can be
      downloaded
  KODR_SHELL_DOWNLOAD:
    type: string
    required: false
    description: When 1, download the workspace back to the host after the run
  KODR_SHELL_POLICY:
    type: string
    required: false
    description: Path to a policy file to use instead of the generated one
  KODR_SHELL_POLICY_TIMEOUT_S:
    type: number
    required: false
    description: Seconds for `openshell policy update --wait` (default 60, OpenShell's own)
  KODR_SHELL_DRYRUN:
    type: string
    required: false
    description: When 1, print the generated policy and assembled commands and run nothing

outputs:
  exitCode:
    type: number
    description: Kodr's exit code from the sandbox, forwarded unchanged
  commands:
    type: array
    description: In dry-run, the assembled openshell invocations, in order
  policy:
    type: string
    description: The generated policy YAML (printed in dry-run, written to a temp file otherwise)
  downloaded:
    type: array
    description: Paths pulled back from the sandbox workspace when KODR_SHELL_DOWNLOAD=1

constraints:
  - >
    The wrapper is a thin, deterministic assembler over the `openshell` CLI
    and makes no policy decision itself -- it writes rules, the supervisor
    enforces them
  - >
    The Kodr checkout is uploaded and run from there; no npm install step,
    ever. Kodr's zero-dependency rule is what makes this safe -- every other
    agent in OpenShell's own guides needs a package install, which means
    punching registry egress through a default-deny fence before the agent
    has even started. Adding a runtime dependency to Kodr would cost this
    property, not just the zero-deps guard
  - >
    The policy is written to a file and passed at creation with
    `sandbox create --policy FILE`; no separate `policy update` call is
    needed. The `policy update --add-endpoint ... --binary ... --wait` flow
    exists for iterating on a live sandbox, and `--dry-run` previews the
    merged result without sending it to the gateway
  - >
    Egress enforcement is never an L4 port allowlist, but how it is applied
    moved between the two versions tested, so the wrapper must not depend on
    the mechanism. On 0.0.56 the sandbox injected HTTP_PROXY/HTTPS_PROXY
    (observed: http://10.200.0.1:3128) plus NODE_USE_ENV_PROXY=1, and a
    denial came back as a 403 whose body was {"error":"policy_denied"}. On
    0.1.7 with a bridge supervisor no proxy variables are injected at all --
    only NODE_EXTRA_CA_CERTS -- and a denied binary gets a plain
    `curl: (7) Couldn't connect to server` while the allowed binary reaches
    the same host and port normally, which is interception below the HTTP
    layer. The second shape is the stronger one because it does not rely on
    the caller honouring proxy variables, but code that parses the denial
    text will break across versions: treat any non-success as denied and read
    the gateway's own log for the reason
  - >
    Exactly one egress rule in locked mode, scoped with --binary to the node
    path, written as `--add-endpoint host:port:full`. The per-binary scope is
    the whole reason to reach for OpenShell over docker-isolation's iptables
    allowlist and is confirmed working: node fetching the model endpoint
    returned 200 while /usr/bin/curl against the identical URL returned
    403 policy_denied. A rule that omits --binary is a bug, not a
    simplification
  - >
    The node path default is /usr/local/bin/node, which is where the official
    node images put it; /usr/bin/node does not exist there. A --binary scope
    naming a path that does not exist denies everything, and the symptom is
    an egress failure that reads like a bad base URL
  - >
    Credentials are attached as an `openshell provider` record and never
    passed into the sandbox. This version has no `--env` flag on
    `sandbox create` at all, so there is nothing to misuse; the rule matters
    anyway because docker-isolation's KODR_BOX_ENV_PASS does put
    OPENROUTER_API_KEY inside its container, where any model turn that can
    read process.env and reach one allowed endpoint can exfiltrate it
  - >
    inference.local is deliberately unused -- see approach. --base-url points
    at the host model server
  - >
    --base-url is injected only for lmstudio and ollama, never for
    openrouter, and never over an explicit --base-url the caller passed. Kodr
    already supports this shape unchanged (examples/terminal-bench.md reaches
    a host LM Studio at host.docker.internal:1234), so only the alias differs
  - >
    The host alias is host.openshell.internal, never localhost or 127.0.0.1 --
    inside the sandbox those are the sandbox
  - >
    The host model server does not have to listen on 0.0.0.0 under Docker
    Desktop for Mac: LM Studio bound to 127.0.0.1:1234 only was still
    reachable, because Docker Desktop proxies the host alias to host
    loopback. Treat binding beyond loopback as a per-platform *may be
    required* -- on Linux Docker or a non-Docker-Desktop driver it likely is,
    untested here -- and have the wrapper probe reachability and report which
    switch is off rather than asserting the requirement up front
  - >
    `--upload LOCAL[:DEST]` places the directory at DEST/<basename(LOCAL)>,
    not at DEST. Uploading the checkout to /sandbox/kodr yielded
    /sandbox/kodr/kodr2/bin/kodr.mjs and a MODULE_NOT_FOUND on the first
    attempt; plan every sandbox path as DEST/<basename>. .gitignore filtering
    is on by default, which is correct here -- node_modules/ is gitignored and
    not needed
  - >
    The writable set is the workdir plus /tmp, and which paths those are
    depends on the policy, so never hardcode them. 0.1.7's default grants
    read_write only /tmp and /dev/null and relies on include_workdir for the
    workspace, where 0.0.56's named /sandbox outright; 0.1.7 also added /bin
    to read_only and dropped the process: block, so the run-as user is the
    image's own rather than a policy-pinned `sandbox`. That last difference
    moves HOME: under the 0.0.56 policy the home directory was Landlock-denied
    and bash complained about .profile on every exec, while under 0.1.7's it is
    the writable workdir and git can write a global config there. Writes to
    /usr, /etc and /var/tmp are denied either way, and /var/tmp is mode 1777,
    so these are Landlock denials no chmod can lift
  - >
    `--no-keep` deletes the sandbox when the command exits, which destroys
    the workspace and every edit in it. The wrapper defaults to it for
    one-shot runs and requires KODR_SHELL_KEEP=1 with
    KODR_SHELL_DOWNLOAD=1 to bring results back; a run abandoned without a
    download loses both the edits and .kodr/runs
  - >
    `--from` builds a Dockerfile or directory into the local engine on 0.0.56
    but not on 0.1.7, which wants an image reference and prints build
    instructions instead. The wrapper therefore builds the image itself and
    passes a tag, which works on both
  - >
    The gateway is a prerequisite the wrapper does not manage and must not
    silently paper over: on 0.1.7 a Docker sandbox needs gateway-minted
    sandbox JWTs (OPENSHELL_LOCAL_TLS_DIR pointing at the PKI, or an explicit
    [openshell.gateway.gateway_jwt] table) and a supervisor that can dial the
    gateway back. `config preflight` exits 0 without the JWT material, so the
    failure appears only at create time as "docker sandboxes require
    launch-scoped gateway authentication" -- fail with that hint rather than
    retrying
  - >
    git needs an identity before the loop's first commit or the whole run ends
    `commit-failed` with "Author identity unknown" after doing the work.
    GIT_AUTHOR_*/GIT_COMMITTER_* in the caller's environment do not reach it,
    because the shell runner replaces the child environment with the curated
    allowlist (see shell spec) -- the wrapper therefore runs `git config
    --global` inside the sandbox, which lands in the writable workdir, and a
    repo-local [user] block in .git/config works too
  - >
    `--upload` cannot be combined with a trailing create command on 0.1.7
    ("--upload cannot be used with [COMMAND]"), so the wrapper creates the
    sandbox with a keepalive command, waits for Ready, then uploads with the
    separate `sandbox upload` subcommand. Upload needs --no-git-ignore or .git
    is silently dropped and `kodr loop` has no history to reset to; note the
    asymmetry that upload nests under DEST/<basename> while download writes
    the contents straight into the local path
  - >
    The policy is generated per run rather than shipped as a fixture, so it
    cannot disagree with the injected base URL: overriding the host alias or
    the port has to move the allowed endpoint too, or egress is denied in a way
    that reads exactly like a bad base URL. KODR_SHELL_POLICY overrides it with
    a file for hand-tuning
  - >
    The image pins a node tag carrying the fix for CVE-2026-111497, the
    out-of-bounds write in Brotli's decoder reachable through node:zlib. Kodr's
    own code never decompresses anything -- there is no zlib, brotli or http2
    anywhere in the repo, and node:http sends no Accept-Encoding -- but
    run_command spawns a shell and a model-run script might, so the sandbox
    should not be the weakest Node on the machine
  - >
    The shipped image is node-only and other languages get their own image,
    baked on the host and passed with KODR_SHELL_IMAGE. This is forced by the
    design rather than a convenience: egress is default-deny and scoped to the
    node binary, so the sandbox cannot rustup, apt-get or pip a toolchain at
    run time. A layered image must keep procps and node at the path
    KODR_SHELL_NODE names, since the egress rule is scoped to that exact path.
    One image per language, not one fat multi-language image -- adding Rust
    took the image from ~490MB to ~1.4GB and a sandbox pulls all of it
  - >
    An image ENV line does not reach the exec'd process at all, so a variable
    a task needs cannot be baked into the image. KODR_SHELL_ENV carries
    comma-separated NAME=VALUE pairs (values cannot contain a comma) and does
    two things, both required: it sets them on kodr's own process, and it
    declares each name to kodr with --env. The second half is not optional --
    kodr replaces its children's environment with a curated allowlist, so
    hooks and run_command see the variable UNSET without it, which is what a
    sandbox probe hook actually printed. A caller's own --env wins and is left
    alone
  - >
    The script body lives in a main() function called at the bottom, so bash
    parses the whole file before executing any of it. Bash otherwise reads a
    script incrementally from a file offset, and editing the file under a
    running shell shifts those offsets into a garbage parse -- observed as a
    syntax error partway through a multi-hour run whose script had been edited
    in the repo meanwhile. This matters more here than most places, since the
    wrapper exists to drive runs long enough that someone is likely to be
    editing the repo while one is in flight. The body is deliberately left
    unindented: the generated policy is whitespace-sensitive YAML in a heredoc
  - >
    The sandbox image must contain procps. shell.mjs shells out to
    `ps -Ao pid,ppid` to find a timed-out command's descendants; without it
    the orphan kill degrades to signalling only the direct /bin/sh child and a
    grandchild outlives the "timed out" command -- the exact hang the shell
    spec's timeout constraint exists to prevent
  - >
    Landlock and policy denials arrive as ordinary non-zero exit codes and
    EACCES text, which Kodr's returned-not-thrown module contract absorbs
    without crashing. The heal loop can still burn turns retrying a path
    policy will never permit; no-progress detection (see heal spec) is the
    backstop, and an eval should confirm it fires rather than exhausting the
    budget
  - >
    The host alias resolves to both an IPv4 address and an IPv6 ULA inside
    the sandbox. A reported OpenShell failure class is the policy admitting
    only IPv4 while the sandbox connects over IPv6, surfacing as a 403
    policy_denied that reads exactly like a bad base URL. Not reproduced on
    this version and driver -- node connected fine -- so this is a diagnostic
    note rather than a rule: on an unexplained denial check
    `getent ahosts host.openshell.internal` before touching the base URL
  - >
    Sandbox name, host alias, ports, node path, sandbox root, workspace,
    network posture, provider record and the policy --wait timeout are all
    overridable by KODR_SHELL_* variables -- no fixed operational limit the
    caller cannot change. The CLI's own `--timeout` is in seconds, not
    milliseconds
  - >
    Dry-run prints the generated policy and every assembled openshell
    invocation and runs none of them; the provider record is referenced by
    name, so no secret value is echoed
  - >
    On macOS the sandbox runs inside a Linux VM via Docker, so the Landlock
    and seccomp controls apply there and not to the host OS. The boundary is
    still real; it is just one level further out than on Linux
  - >
    Expect two harmless noises on every exec and do not chase them:
    `/home/sandbox/.profile: Permission denied` from bash, because Landlock
    denies the home directory, and an [UNDICI-EHPA] experimental warning from
    node, because the sandbox sets NODE_USE_ENV_PROXY=1. Adding the home
    directory to the policy's read_only list would likely silence the first
    (untested)
  - >
    OpenShell is pre-1.0 with a fast-moving CLI, and the version tested
    (0.0.56) already differs from its published docs in several flags --
    `policy get --base` does not exist, the effective policy is
    `policy get NAME --full` and needs a live sandbox. The wrapper pins
    nothing and asserts nothing about flag spellings beyond what it
    assembles, so a CLI change should break the dry-run tests loudly rather
    than silently produce a sandbox with no rules

deliverables:
  - scripts/kodr-shell.sh
  - docker/openshell/Dockerfile
  - specs/openshell-isolation.yaml
  - test/openshell-isolation.test.mjs
  - docs/openshell-isolation.md

tests:
  unit:
    - injects the lmstudio base-url at the host alias by default
    - injects the ollama port when --provider ollama
    - accepts --provider=ollama in equals form too
    - does not inject a base-url when the caller passes one
    - never injects a base-url for openrouter
    - the generated policy carries exactly one network rule in locked mode
    - the policy scopes its rule to the node binary
    - the node path defaults to /usr/local/bin/node and honours an override
    - the allowed endpoint moves with the host and port overrides
    - open mode adds the provider's public host
    - the workspace stays writable through include_workdir
    - uploads the checkout and the workspace, and never installs anything
    - both uploads pass --no-git-ignore so .git survives for the loop
    - sandbox paths are computed as root/basename, matching upload semantics
    - injects --cwd unless the caller passes one
    - forwards the prompt and passthrough args unchanged
    - forwards KODR_SHELL_ENV pairs into the exec, warning on a malformed entry
    - also declares those names to kodr with --env, and leaves a caller's --env alone
    - passes the git identity as environment, not a config write
    - attaches a provider record by name, forwarding no secret value
    - emits a docker build only when asked
    - holds the sandbox open with a configurable keepalive
    - emits a download when keeping the sandbox
    - refuses a download that would be deleted with the sandbox
    - emits no download by default
    - dry-run prints the policy and commands while invoking nothing
  eval:
    - kodr doctor passes inside the sandbox against the host model server
    - a locked run completes a read/edit/verify task in the sandbox workspace
    - a model-issued curl to the allowed endpoint is denied while node's model calls succeed
    - a model-issued request to a non-allowed host is denied and the run continues
    - a model-issued write outside the sandbox root is denied by Landlock and the run continues
    - the heal loop stops on no-progress rather than exhausting its budget against a denied path
    - edits made in the sandbox come back intact through the download step
    - commits made in the sandbox come back with history intact and a clean status
    - a loop checklist runs unattended to backlog-empty with every task marked
