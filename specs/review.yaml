name: review pass
status: implemented
description: >
  A review pass: a fresh tool-loop conversation over what the build phase
  changed, with real (read-only) file access instead of a single pasted
  diff and nothing else. Optionally runs on a separate review model,
  loaded and verified via lms.mjs (see specs/lms.yaml) rather than the
  build model's own load.

  This replaces an entirely manual practice from dogfooding this harness
  against Claude Code head-to-head: pasting a diff to a second model by
  hand and judging its findings. That comparison showed the upside and the
  risk of giving a reviewer real tools side by side with the same model
  used diff-only in this harness — most tool-backed reviews were grounded
  and specific, but one answered in a single turn with zero tool calls and
  fabricated findings wholesale (a quoted error message that doesn't exist
  in the file, a syntax the file doesn't use, a cited file that isn't in
  the repo at all). Nothing about the output format distinguished it from
  a real review until its specific claims were checked against the actual
  code. The minimum-tool-call floor exists specifically to catch that
  failure mode automatically instead of relying on a human to notice it.

inputs:
  client:
    type: object
    required: true
    description: Model client (same one used for the build phase; the review model is just a different modelId on the same client)
  modelId:
    type: string
    required: true
    description: Review model to use
  cwd:
    type: string
    required: true
    description: Workspace root
  filesChanged:
    type: string[]
    required: true
    description: Files touched during the build phase. An empty list skips the review entirely — there's nothing to look at.
  startedAt:
    type: Date
    required: false
  maxRunMs:
    type: number
    required: false
    description: Stop between turns after this many ms (0 disables), same run budget as the build phase
  contextWindow:
    type: number
    required: false
  heartbeatMs:
    type: number
    required: false
  onHeartbeat:
    type: function
    required: false
  envPassthrough:
    type: string[]
    required: false
  minToolCalls:
    type: number
    required: false
    description: >
      Tool-call floor before a review counts as grounded (default 2 —
      KODR_REVIEW_MIN_TOOL_CALLS; 0 disables the floor and the retry)
  maxToolTurns:
    type: number
    required: false
    description: >
      Tool-turn ceiling for each review attempt (default 12 —
      KODR_REVIEW_MAX_TOOL_TURNS)
  diffTimeoutMs:
    type: number
    required: false
    description: >
      Timeout for the git diff call that gathers review context (default
      30,000 — KODR_REVIEW_DIFF_TIMEOUT_MS)

outputs:
  skipped:
    type: boolean
    description: True when there were no changed files to review
  findings:
    type: string
    description: The review model's final text response, verdict line removed
  verdict:
    type: string
    description: >
      "pass" or "fail" -- what the reviewer said. Absent on a skipped review:
      there was no assessment, and undefined must not be readable as one.
  verdictFound:
    type: boolean
    description: >
      False when no verdict line could be parsed at all; verdict is then
      "fail", fail-closed. Distinct from the verdict itself because "the
      reviewer never emits a verdict line" and "the reviewer keeps failing us"
      are different operational problems with different fixes.
  passed:
    type: boolean
    description: >
      The harness's decision, as opposed to what the reviewer said. Diverges
      from verdict only in that an unparseable reply reads as a fail.
  grounded:
    type: boolean
    description: >
      False when even the retry attempt stayed under minToolCalls — the
      findings are still returned, but callers should present them as
      unverified rather than as a reliable review
  toolTurns:
    type: number
    description: Tool calls made by whichever attempt is reported (the retry's, if one happened)
  usage:
    type: object
    description: Combined prompt/completion token usage across both attempts
  retries:
    type: number
    description: Combined retries used by both attempts' chat calls

constraints:
  - >
    The review pass runs on every command that drives run() -- kodr run, kodr
    goal, and each task of a kodr loop -- not just kodr run. goal and loop
    each carried their own byte-identical copy of the per-run options and
    both omitted every review field, so --review-model was documented,
    accepted, and silently inert on them. buildRunOptions in cli.mjs is now
    the single definition those two share.
  - >
    Gating is opt-in via --fail-on-review (KODR_FAIL_ON_REVIEW), off by
    default. A review FAIL is not a test failure: the reviewer cannot run
    anything, so the signal is "a second model's static read disagrees" --
    legitimate, but weaker evidence than verification.passed, while carrying
    the same power over the exit code. Leaving it advisory by default also
    preserves every existing --review-model workflow unchanged.
  - >
    The reviewer must end with an explicit VERDICT: PASS or VERDICT: FAIL
    line, parsed by specs/verdict.yaml. Fail-closed: a missing, garbled,
    contradictory, or think-block-only verdict reads as fail. A verdict is
    permission to proceed, and a reply nobody can parse must never be that.
  - >
    The single nudge retry now fires for either shortfall -- under the
    tool-call floor, or no parseable verdict -- and for both at once, joining
    the two prompt fragments rather than choosing between them. Requiring a
    trailing line makes the prompt load-bearing, and small local models drop
    reply-format instructions routinely; reusing the existing retry costs
    nothing in the common case. reviewVerdictMissingRate in specs/stats.yaml
    is how often that is happening.
  - >
    Grounding is advisory, not a gate. An ungrounded PASS is recorded, named
    in the notice, and counted in reviewGroundedRate, but it does not block.
    The symmetric rule from specs/goal.yaml (an ungrounded MET never stops the
    loop) was considered and rejected here: a review only runs when files
    actually changed, so the remaining ungrounded case is a small reviewer
    being lazy on a trivial diff, and parking good work overnight is the
    expensive direction to fail in. Revisit if reviewGroundedRate says
    otherwise.
  - >
    A skipped review returns exactly { skipped: true } (plus reason or error
    on the paths that have one) and gains no verdict, verdictFound, or passed
    field. undefined is not false, and no gate decision may be derived from an
    absent field -- which is what keeps an empty changeset, an incomplete
    build, a failed model switch, and a crashed reviewer all non-blocking by
    construction.
  - >
    The tool registry is restricted to read_file, list_files, and search —
    never write_file, edit_file, or run_command. A review pass must not be
    able to touch the workspace, matching the existing guarantee that
    review never edits files.
  - >
    A diff (git diff -- <changed files>) is generated once, up front, by
    the harness itself — not exposed as a run_command call the model could
    make, since the read-only tool set has no shell access at all. If git
    isn't available or the workspace isn't a repo, the diff is silently
    empty and the model relies entirely on read_file/list_files/search;
    this is not an error, just a smaller starting context.
  - >
    The review system prompt carries the same small-model steering the
    build prompt got (see specs/harness.yaml): the tool-channel contract
    (one call per message, never text-form), the completion semantics (a
    reply with no tool call ends the review, so investigate before
    answering — the final reply is the review itself), the tool error
    contract, and the data-not-instructions trust rule. It also discloses
    what the reviewer cannot do — the tool set is read-only, so it must
    never claim to have run tests or builds — and constrains the reply
    format (concrete findings ordered most severe first, correctness only,
    or the exact reply "No findings.").
  - >
    If the first attempt's tool-call count is under minToolCalls, exactly
    one retry runs with an explicit nudge appended to the prompt ("read
    the actual changed files... a review that never opened a file has no
    business citing a file:line"). If the retry is still under the floor,
    grounded is false but the findings are still returned — never silently
    discarded, so a human (or a future automated consumer) can see and
    discount them explicitly rather than have low-tool-call reviews
    silently vanish.
  - >
    Skipped when filesChanged is empty — there's nothing for a reviewer to
    look at, and running one anyway would either stall on an empty diff or
    invite exactly the hallucination this feature exists to catch.
  - >
    Model switching (build model -> review model) goes through
    lms.mjs's ensureModelLoaded when a review model is configured — see
    specs/lms.yaml. When no review model is given, none of this runs at
    all; a single model for both roles is the default, unchanged behavior.
  - >
    The harness's own orchestration (runReviewPass in harness.mjs) never
    lets a failure in either the model switch or the review itself escape
    as a thrown error — both are caught and turned into
    { skipped: true, error }, so a review-pass failure can never overwrite
    or crash an otherwise-successful build result. reviewContextWindow is
    treated as unset only when it's null/undefined, not merely falsy — an
    explicit 0 (this repo's own "disable" convention) must not be silently
    replaced by the build model's own context window.
  - >
    run() itself only calls runReviewPass when the build's own
    stoppedReason is 'complete' — a timeout, an externally-recovered hang,
    tool-limit, or budget-exceeded skips the review pass entirely rather
    than reviewing a build that didn't finish. When reviewModel is
    configured but this gate skips the call, result.review is still set
    explicitly to { skipped: true, reason } rather than left undefined —
    undefined is reserved for "no review model configured at all." Without
    this, --json output (summarizeResult's review field) made the two
    cases indistinguishable, discovered during a long dogfood run where
    half the phases silently never got reviewed and it wasn't obvious from
    the run's own output why.

tests:
  unit:
    - buildRunOptions passes the review options through to every run it drives
    - buildRunOptions omits contextWindow and reviewContextWindow when unset, rather than passing null
    - buildRunOptions carries cwd and quiet through
    - shouldFailProcess ignores a blocking review by default
    - shouldFailProcess fails the CLI process on a blocking review when failOnReview is set
    - shouldFailProcess does not fail on a passing review when failOnReview is set
    - shouldFailProcess does not fail on a skipped review even when failOnReview is set
    - parseArgs parses --fail-on-review as a boolean flag, off by default
    - returns verdict "pass" for a review ending in VERDICT: PASS
    - returns verdict "fail" for a review ending in VERDICT: FAIL
    - strips the verdict line out of findings
    - nudges once for a missing verdict line, then fails closed if it is still absent
    - ignores a verdict the reviewer wrote inside its own think block
    - reports an ungrounded pass as passed, with grounded false
    - a skipped review carries no verdict, verdictFound, or passed field
    - the review system prompt requires a trailing VERDICT: PASS or VERDICT: FAIL line
    - reviewBlocks is false for an absent review, a skipped review, and one skipped for an incomplete build
    - reviewBlocks is false for a review that crashed
    - reviewBlocks is true for a fail verdict
    - reviewBlocks is false for an ungrounded pass, which is advisory
    - parseReviewVerdict reports verdict fail with verdictFound false when no verdict line exists
    - failOnReviewEnabled resolves the option, then KODR_FAIL_ON_REVIEW, then false
    - reviewNotice names the verdict and how much the reviewer looked at
    - reviewNotice says when a verdict line was missing entirely
    - reviewNotice flags an ungrounded verdict
    - returns skipped: true when filesChanged is empty, without calling the model
    - runs a read-only tool loop and returns findings from the final turn
    - system prompt states the read-only tool set, completion semantics, grounding rules, and reply format
    - restricts the tool registry so write_file/edit_file/run_command are unavailable
    - marks a review grounded when the first attempt meets minToolCalls
    - retries once with a nudge when the first attempt is under minToolCalls
    - marks grounded: false when the retry is still under minToolCalls, but still returns its findings
    - does not retry when minToolCalls is 0
    - combines usage across both attempts when a retry happens
    - combines chat-call retries across both attempts when a nudge retry happens
    - includes a git diff of the changed files in the prompt when one is available
    - falls back to no diff without erroring when git is unavailable or the workspace isn't a repo
    - minReviewToolCalls resolves option, then KODR_REVIEW_MIN_TOOL_CALLS, then the default
    - reviewMaxToolTurns resolves option, then KODR_REVIEW_MAX_TOOL_TURNS, then the default
    - reviewDiffTimeoutMs resolves option, then KODR_REVIEW_DIFF_TIMEOUT_MS, then the default
    - runReviewPass returns { skipped, error } rather than throwing when the model switch fails
    - runReviewPass returns { skipped, error } rather than throwing when the review itself fails
    - run() sets result.review to { skipped: true, reason } when reviewModel is set but the build's stoppedReason isn't 'complete'
    - summarizeResult includes the review field (null when absent) so --json output distinguishes "no review model configured" from "configured but skipped"
