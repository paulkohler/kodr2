name: shell runner
status: implemented
description: >
  Shared command runner used by the run_command tool and verification.
  Spawns /bin/sh -c with a curated environment, a generous timeout, and
  bounded output. The single execution path so the two callers cannot
  diverge.

inputs:
  command:
    type: string
    required: true
    description: Shell command to run
  cwd:
    type: string
    required: true
    description: Working directory
  timeout:
    type: number
    required: false
    description: Timeout in ms (default 600,000 — 10 minutes)
  maxOutput:
    type: number
    required: false
    description: Max characters kept per stream (default 50,000)
  env:
    type: object
    required: false
    description: Child environment (defaults to the curated allowlist)
  heartbeatMs:
    type: number
    required: false
    description: >
      Interval in ms for onHeartbeat while the command runs (0 or omitted
      disables it). A generous timeout is otherwise silent for its whole
      duration, making a legitimately slow command indistinguishable from a
      stuck one without inspecting processes from outside.
  onHeartbeat:
    type: function
    required: false
    description: Called with elapsed ms on each heartbeat tick
  killGraceMs:
    type: number
    required: false
    description: >
      Delay in ms before escalating a timed-out command tree from SIGTERM
      to SIGKILL (default 5,000)
  psTimeoutMs:
    type: number
    required: false
    description: >
      Timeout in ms for the `ps` call used to discover a timed-out
      command's descendant processes (default 2,000)

outputs:
  stdout:
    type: string
    description: Command stdout, truncated to maxOutput
  stderr:
    type: string
    description: Command stderr, truncated to maxOutput
  exitCode:
    type: number
    description: Process exit code

constraints:
  - Commands run via /bin/sh -c
  - 10 minute timeout by default, generous for slow local-model-driven builds
  - Never throws — non-zero exit, signal, timeout, and buffer overflow all map to a non-zero exitCode
  - A numeric process exit code is preserved; anything else maps to 1
  - Output is truncated per stream and marked with a trailing [truncated]
  - >
    onHeartbeat fires only while heartbeatMs > 0 and a callback is provided;
    the interval is cleared as soon as the command finishes
  - >
    A timeout kills every process the command spawned, not just the
    immediate /bin/sh child. execFile's own built-in timeout only signals
    that direct child, so a grandchild the shell spawned (npm's own `node
    --test` child, for example) could outlive the "timed out" command and
    hang the box indefinitely -- this matters because /bin/sh -c "npm
    test" is a process tree, not a single process. Two mechanisms run, in
    this order: the command's process group is signalled, and `ps -Ao
    pid,ppid` is walked from the direct child's pid. The walk is not
    vestigial -- it is what covers a host that silently refuses to create a
    new process group for a detached child, which would otherwise make the
    group kill a no-op. This spec previously said descendants were found by
    the walk *rather than* by relying on groups, which was true before the
    runner moved to `spawn`; the group is now the primary mechanism and the
    next two constraints are why.
  - >
    The command runs in its own process group and a timeout or cancellation
    signals the group as well as the ppid-walked descendants. The group is the
    only thing that reaches a backgrounded orphan: `sh -c "cargo run &"` exits
    at once, so the child is reparented to init and stops being anyone's
    descendant -- there is no moment at which a ppid walk could find it -- but
    process group membership is inherited and survives reparenting. The group
    kill is attempted, not relied on, so a host that refuses to create one
    (the original reason this module avoided groups) just falls back to the
    walk: a group id that was never created ESRCHes, and it cannot hit
    anything else by accident, since a group's id is its leader's pid and the
    only process with that pid is our own child.
  - >
    A host can report group membership while refusing the group *signal*, and
    one that matters does: inside an OpenShell sandbox `kill(-pgid)` returns
    EPERM under seccomp while a single-pid kill on the same process succeeds.
    So when the group signal fails for any reason the group is enumerated
    instead -- `ps -Ao pid,pgid` filtered to `pgid == child.pid` -- and its
    members are killed one at a time. That lookup is what reaches the orphan,
    since membership is inherited and survives reparenting while the ppid
    chain does not. It stays safe in the case that would otherwise be
    catastrophic: a group's id is its leader's pid, so a row matching
    `pgid == child.pid` can only exist if our own child created that group. If
    `detached` was refused the child sits in the parent's group under a
    different id, nothing matches, and the lookup returns empty rather than
    selecting Kodr and the user's shell. The current process is excluded
    regardless.
  - >
    Known limit: a command that calls `setsid` itself leaves the group, and
    nothing here reaches it. Untested, and out of scope -- a process that has
    deliberately escaped every handle the parent holds is not something a
    timeout can be expected to reap.
  - >
    This is why the runner uses `spawn` rather than `execFile`: execFile
    silently drops `detached`, leaving the child in the parent's process group
    (verified -- the child's pgid came back as the launching shell's), so
    there is no group to signal and the orphan survives. Output capping is
    therefore done by hand in place of execFile's maxBuffer: accumulation
    stops at twice maxOutput and the tree is killed, which keeps overflow
    mapping to a non-zero exit as before.
  - >
    A detached child no longer receives the terminal's SIGINT, so
    cancellation is forwarded explicitly: runShell takes an optional
    AbortSignal, kills the group and answers at once when it fires. This is
    strictly better than relying on terminal delivery, which never worked for
    a non-TTY front-end (the loop, ACP) -- an interrupted run there left its
    command running to completion. The signal reaches run_command through the
    tool registry's context and Stop hooks through runStopHooks.
  - >
    The descendant list is snapshotted once, at the moment SIGTERM is
    sent, and the same list is reused for the SIGKILL escalation rather
    than re-querying `ps`. Once a process in the tree dies, any surviving
    child of it is reparented (to init), which changes its ppid -- a
    second lookup at SIGKILL time would lose track of it.
  - >
    The timeout resolves the caller itself rather than waiting for
    execFile's callback, which fires only once the child has exited *and*
    its stdout and stderr pipes have closed. A backgrounded command keeps
    those pipes open after `sh` exits (`cargo run &`), so the callback
    never arrives -- and since `sh` is already gone the orphan was
    reparented to init *before* the timeout fired, so the ppid walk above
    has nothing to find and kills nothing. The earlier tree-kill fix
    reasoned about reparenting happening after SIGTERM and snapshotted to
    survive it; with `&` it happens first, and no snapshot moment exists
    where the orphan was ever a reachable descendant. Until this, a
    model-issued background command pended for minutes regardless of
    --command-timeout-ms (observed: `cargo run &` pending ~7 minutes
    against 180,000ms). Resolving on the timeout makes the limit mean what
    it says.
  - >
    A timed-out command tree first gets SIGTERM, then SIGKILL after
    killGraceMs if any of it hasn't exited. The SIGKILL escalation is not
    cancelled just because the command's own callback already fired --
    the immediate child can die quickly from SIGTERM while a stubborn
    descendant (one that ignores SIGTERM) is still running and needs the
    follow-up SIGKILL.
  - >
    The `ps` call used to discover descendants is itself bounded by
    psTimeoutMs, so a wedged `ps` binary can't reintroduce the same class
    of hang this mechanism exists to close

tests:
  unit:
    - a timeout answers the caller even when a backgrounded orphan holds the pipes open
    - a timeout kills a backgrounded process the ppid walk cannot see
    - groupMemberPids finds the members of a group the child leads
    - groupMemberPids never returns the current process
    - groupMemberPids returns nothing for a group id that does not exist
    - an AbortSignal cancels the command and kills its group
    - a signal already aborted answers at once
    - a foreground command that overruns its timeout still reports a non-zero exit
    - successful command returns exit code 0
    - reports the process exit code on failure
    - captures stdout and stderr separately
    - truncates long output and marks it
    - timed out command returns a non-zero exit code
    - kills grandchild processes on timeout, not just the shell
    - calls onHeartbeat on an interval while a command runs
    - does not call onHeartbeat when heartbeatMs is 0
    - stops calling onHeartbeat once the command finishes
